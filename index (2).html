<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<title>Assistant</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel-2: #171b25;
    --border: #232936;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #6c8cff;
    --accent-2: #a06cff;
    --danger: #ff6b6b;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -30% -10% auto -10%;
    height: 60vh;
    background: radial-gradient(60% 60% at 50% 0%, rgba(108,140,255,.16), transparent 70%),
                radial-gradient(50% 50% at 80% 10%, rgba(160,108,255,.12), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  /* ---------- Top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  border-bottom: 1px solid var(--border);
  background: rgba(11,13,18,.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 650;
  letter-spacing: -.01em;
}

.logo {
  width: 28px; height: 28px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center;
  box-shadow: 0 4px 14px rgba(108,140,255,.35);
}
.logo svg { width: 15px; height: 15px; }

.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(108,140,255,.14);
  color: #a9bcff;
  border: 1px solid rgba(108,140,255,.25);
}
.badge.live {
  background: rgba(52,211,153,.14);
  color: #6ee7b7;
  border-color: rgba(52,211,153,.3);
}

.spacer { flex: 1; }

.icon-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  cursor: pointer;
  transition: .15s;
}
.icon-btn:hover { color: var(--text); border-color: #333c4f; background: var(--panel-2); }
.icon-btn svg { width: 17px; height: 17px; }

/* ---------- Messages ---------- */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px 16px 8px;
  scrollbar-width: thin;
  scrollbar-color: #2b3242 transparent;
}
.messages::-webkit-scrollbar { width: 8px; }
.messages::-webkit-scrollbar-thumb { background: #2b3242; border-radius: 8px; }

.messages-inner {
  max-width: 780px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.msg {
  display: flex;
  gap: 11px;
  animation: rise .25s ease both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.msg.user { flex-direction: row-reverse; }

.avatar {
  flex: 0 0 30px;
  width: 30px; height: 30px;
  border-radius: 9px;
  display: grid; place-items: center;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .02em;
  margin-top: 2px;
}
.msg.assistant .avatar {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
}
.msg.user .avatar {
  background: #2a3245;
  color: #b7c1d6;
}

.bubble {
  max-width: min(85%, 620px);
  padding: 11px 14px;
  border-radius: var(--radius);
  font-size: 14.5px;
  line-height: 1.62;
  word-wrap: break-word;
  overflow-wrap: anywhere;
}
.msg.assistant .bubble {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-top-left-radius: 5px;
}
.msg.user .bubble {
  background: linear-gradient(135deg, #4f6ef7, #6c4ff7);
  color: #fff;
  border-top-right-radius: 5px;
  box-shadow: 0 6px 18px rgba(79,110,247,.25);
}
  .bubble p { margin: 0 0 9px; }
  .bubble > *:last-child { margin-bottom: 0 !important; }
  .bubble ul, .bubble ol { margin: 0 0 9px; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble strong { font-weight: 650; }
  .bubble a { color: #a9bcff; }
  .bubble code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .875em;
    background: rgba(255,255,255,.08);
    padding: 2px 5px;
    border-radius: 5px;
  }
  .msg.user .bubble code { background: rgba(0,0,0,.2); }
  .bubble pre {
    background: #0a0c11;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    overflow-x: auto;
    margin: 0 0 9px;
  }
  .bubble pre code {
    background: none;
    padding: 0;
    font-size: 12.5px;
    line-height: 1.6;
  }

  /* tool chips */
  .tools {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 9px;
  }
  .tool {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .tool.done { color: #6ee7b7; border-color: rgba(52,211,153,.3); background: rgba(52,211,153,.1); }

  .typing { display: inline-flex; gap: 4px; padding: 3px 0; }
  .typing i {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.3s infinite both;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: .25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-3px); }
  }

  .caret {
    display: inline-block;
    width: 7px; height: 15px;
    background: var(--accent);
    border-radius: 2px;
    vertical-align: -2px;
    margin-left: 2px;
    animation: caret 1s steps(2) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }

  /* ---------- Composer ---------- */
  .composer-wrap {
    padding: 10px 16px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 55%, transparent);
  }

  .composer {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 8px 8px 16px;
    transition: border-color .18s, box-shadow .18s;
  }
  .composer:focus-within {
    border-color: rgba(108,140,255,.55);
    box-shadow: 0 0 0 3px rgba(108,140,255,.12);
  }

  #input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    max-height: 160px;
    padding: 8px 0;
  }
  #input::placeholder { color: #5f6879; }

  .round-btn {
    flex: 0 0 38px;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    display: grid; place-items: center;
    cursor: pointer;
    transition: .16s;
    color: #fff;
  }
  .round-btn svg { width: 17px; height: 17px; }
  .round-btn:disabled { opacity: .4; cursor: not-allowed; }

  #micBtn { background: #232a38; color: var(--muted); }
  #micBtn:hover:not(:disabled) { color: var(--text); background: #2c3444; }
  #micBtn.listening {
    background: rgba(255,107,107,.15);
    color: #ff8b8b;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,.35); }
    50% { box-shadow: 0 0 0 8px rgba(255,107,107,0); }
  }

  #sendBtn { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  #sendBtn:hover:not(:disabled) { transform: scale(1.05); }
  #sendBtn.stop { background: #3a2028; color: var(--danger); }

  .hint {
    max-width: 780px;
    margin: 8px auto 0;
    text-align: center;
    font-size: 11px;
    color: #545d70;
  }
  .hint kbd {
    font-family: inherit;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10px;
  }

  /* ---------- Settings drawer ---------- */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s;
    z-index: 40;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .settings {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(380px, 100vw);
    background: var(--panel);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform .26s cubic-bezier(.32,.72,0,1);
    z-index: 50;
    display: flex;
    flex-direction: column;
  }
  .settings.open { transform: none; }

  .settings header {
    display: flex;
    align-items: center;
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: 650;
  }

  .settings-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: .01em;
  }
  .field input[type="text"],
  .field input[type="password"],
  .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus, .field textarea:focus { border-color: rgba(108,140,255,.55); }
  .field textarea { resize: vertical; min-height: 74px; line-height: 1.5; }
  .field .desc { font-size: 11px; color: #5f6879; margin-top: 5px; line-height: 1.5; }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 0;
  }
  .switch-row + .switch-row { border-top: 1px solid var(--border); }
  .switch-row span { font-size: 13px; }
  .switch-row small { display: block; font-size: 11px; color: #5f6879; margin-top: 2px; }

  .switch {
    position: relative;
    flex: 0 0 40px;
    width: 40px; height: 23px;
    border-radius: 999px;
    background: #2a3245;
    cursor: pointer;
    transition: background .18s;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 17px; height: 17px;
    border-radius: 50%;
    background: #8b93a7;
    transition: .18s;
  }
  .switch.on { background: rgba(108,140,255,.9); }
  .switch.on::after { transform: translateX(17px); background: #fff; }

  .danger-btn {
    margin-top: auto;
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid rgba(255,107,107,.3);
    background: rgba(255,107,107,.08);
    color: #ff8b8b;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
  }
  .danger-btn:hover { background: rgba(255,107,107,.15); }

  @media (max-width: 600px) {
    .bubble { max-width: 88%; font-size: 14px; }
    .messages { padding: 16px 12px 4px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6l-8-4z"/>
        </svg>
      </div>
      Assistant
      <span class="badge" id="modeBadge">Demo</span>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="newChatBtn" title="New chat" aria-label="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.4.67.74.88H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <main class="messages" id="messages">
    <div class="messages-inner" id="messagesInner"></div>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask anything, or tap the mic…" autocomplete="off"></textarea>
      <button class="round-btn" id="micBtn" title="Voice input" aria-label="Voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0M12 19v3"/>
        </svg>
      </button>
      <button class="round-btn" id="sendBtn" title="Send" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <div class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="settings" id="settings" aria-hidden="true">
  <header>
    Settings
    <div class="spacer"></div>
    <button class="icon-btn" id="closeSettings" aria-label="Close settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </header>
  <div class="settings-body">
    <div class="field">
      <label for="apiUrl">API base URL</label>
      <input type="text" id="apiUrl" placeholder="http://localhost:8000/v1" />
      <div class="desc">Any OpenAI-compatible endpoint. Leave empty to stay in demo mode.</div>
    </div>

    <div class="field">
      <label for="apiKey">API key</label>
      <input type="password" id="apiKey" placeholder="sk-…" />
      <div class="desc">Stored only in this browser's localStorage.</div>
    </div>

    <div class="field">
      <label for="model">Model</label>
      <input type="text" id="model" placeholder="gpt-4o-mini" />
    </div>

    <div class="field">
      <label for="systemPrompt">System prompt</label>
      <textarea id="systemPrompt" placeholder="You are a helpful assistant…"></textarea>
    </div>

    <div>
      <div class="switch-row">
        <span>Speak replies
          <small>Read assistant messages aloud</small>
        </span>
        <div class="switch" id="ttsSwitch" role="switch" tabindex="0"></div>
      </div>
      <div class="switch-row">
        <span>Auto-send voice
          <small>Send as soon as speech ends</small>
        </span>
        <div class="switch" id="autoSendSwitch" role="switch" tabindex="0"></div>
      </div>
    </div>

    <button class="danger-btn" id="clearBtn">Clear conversation</button>
  </div>
</aside>
<script>
(() => {
  "use strict";

  const $ = (sel, root = document) => root.querySelector(sel);
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  /* ---------------- State ---------------- */
  const STORAGE_KEY = "assistant.state.v1";
  const SETTINGS_KEY = "assistant.settings.v1";

  const DEFAULT_SETTINGS = {
    apiUrl: "",
    apiKey: "",
    model: "gpt-4o-mini",
    systemPrompt: "You are a helpful, concise assistant. Use markdown when it improves clarity.",
    tts: false,
    autoSend: true
  };

  let settings = { ...DEFAULT_SETTINGS, ...readJSON(SETTINGS_KEY, {}) };
  let messages = readJSON(STORAGE_KEY, []);

  const state = {
    streaming: false,
    stopped: false,
    controller: null,
    recognition: null,
    listening: false,
    voiceBase: ""
  };

  /* ---------------- Elements ---------------- */
  const messagesEl = $("#messages");
  const messagesInner = $("#messagesInner");
  const inputEl = $("#input");
  const sendBtn = $("#sendBtn");
  const micBtn = $("#micBtn");
  const modeBadge = $("#modeBadge");
  const settingsEl = $("#settings");
  const scrim = $("#scrim");

  /* ---------------- Utils ---------------- */
  function readJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch { return fallback; }
  }
  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }
  function save() {
    writeJSON(STORAGE_KEY, messages.map(m => ({
      id: m.id, role: m.role, content: m.content, tools: m.tools || null
    })));
  }
  function saveSettings() { writeJSON(SETTINGS_KEY, settings); }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  /* ---------------- Markdown (lightweight) ---------------- */
  function inlineFormat(s) {
    s = escapeHtml(s);

    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => {
      codes.push(c);
      return "\u0001" + (codes.length - 1) + "\u0001";
    });

    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    s = s.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );

    s = s.replace(/\u0001(\d+)\u0001/g, (_, i) => "<code>" + codes[i] + "</code>");
    return s;
  }

  function renderBlocks(text) {
    const lines = text.split("\n");
    let out = "";
    let listType = null;

    const closeList = () => {
      if (listType) { out += `</${listType}>`; listType = null; }
    };

    for (const line of lines) {
      const ul = line.match(/^\s*[-*+]\s+(.*)$/);
      const ol = line.match(/^\s*\d+\.\s+(.*)$/);

      if (ul) {
        if (listType !== "ul") { closeList(); out += "<ul>"; listType = "ul"; }
        out += "<li>" + inlineFormat(ul[1]) + "</li>";
      } else if (ol) {
        if (listType !== "ol") { closeList(); out += "<ol>"; listType = "ol"; }
        out += "<li>" + inlineFormat(ol[1]) + "</li>";
      } else if (line.trim() === "") {
        closeList();
      } else {
        closeList();
        out += "<p>" + inlineFormat(line) + "</p>";
      }
    }
    closeList();
    return out;
  }

  function renderMarkdown(src) {
    if (!src) return "";
    const parts = String(src).split("```");
    let html = "";

    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        let code = parts[i];
        const nl = code.indexOf("\n");
        if (nl > -1 && nl < 24) code = code.slice(nl + 1);
        html += "<pre><code>" + escapeHtml(code.replace(/\n$/, "")) + "</code></pre>";
      } else {
        html += renderBlocks(parts[i]);
      }
    }
    return html;
  }
  /* ---------------- Rendering ---------------- */
function createMessageEl(msg) {
  const el = document.createElement("div");
  el.className = "msg " + msg.role;
  el.innerHTML =
    '<div class="avatar">' + (msg.role === "assistant" ? "AI" : "You") + "</div>" +
    '<div class="bubble">' +
      '<div class="tools"></div>' +
      '<div class="content"></div>' +
    "</div>";
  msg.el = el;
  messagesInner.appendChild(el);
  return el;
}

function renderBubble(msg) {
  if (!msg.el) return;
  const toolsEl = msg.el.querySelector(".tools");
  const contentEl = msg.el.querySelector(".content");

  if (msg.tools && msg.tools.length) {
    toolsEl.style.display = "flex";
    toolsEl.innerHTML = msg.tools.map(t =>
      `<span class="tool ${t.done ? "done" : ""}">${t.done ? "✓" : "◐"} ${escapeHtml(t.name)}</span>`
    ).join("");
  } else {
    toolsEl.style.display = "none";
  }

  if (msg.pending && !msg.content) {
    contentEl.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  } else {
    contentEl.innerHTML =
      renderMarkdown(msg.content) +
      (msg.pending ? '<span class="caret"></span>' : "");
  }
}

function addMessage(role, content, extra = {}) {
  const msg = {
    id: uid(),
    role,
    content: content || "",
    tools: extra.tools || null,
    pending: !!extra.pending
  };
  messages.push(msg);
  createMessageEl(msg);
  renderBubble(msg);
  scrollToBottom(true);
  return msg;
}

function renderAll() {
  messagesInner.innerHTML = "";
  messages.forEach(msg => {
    msg.el = null;
    createMessageEl(msg);
    renderBubble(msg);
  });
  scrollToBottom(true);
}

function scrollToBottom(force) {
  const nearBottom =
    messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 160;
  if (force || nearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* ---------------- Composer ---------------- */
function autosize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}

function updateSendButton() {
  if (state.streaming) {
    sendBtn.disabled = false;
    sendBtn.classList.add("stop");
    sendBtn.title = "Stop generating";
    sendBtn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';
  } else {
    sendBtn.classList.remove("stop");
    sendBtn.title = "Send";
    sendBtn.disabled = !inputEl.value.trim();
    sendBtn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>';
  }
}

/* ---------------- Sending ---------------- */
async function send(text) {
  const clean = (text || "").trim();
  if (!clean || state.streaming) return;

  addMessage("user", clean);
  inputEl.value = "";
  autosize();
  updateSendButton();
  save();

  const reply = addMessage("assistant", "", { pending: true });
  state.streaming = true;
  state.stopped = false;
  updateSendButton();

  try {
    if (settings.apiUrl.trim()) {
      await streamFromAPI(reply, clean);
    } else {
      await streamFromMock(reply, clean);
    }
  } catch (err) {
    if (err && err.name === "AbortError") {
      if (!reply.content) reply.content = "_Stopped._";
    } else {
      reply.content +=
        (reply.content ? "\n\n" : "") +
        "**Error:** " + (err && err.message ? err.message : "request failed");
    }
  } finally {
    reply.pending = false;
    state.streaming = false;
    state.controller = null;
    renderBubble(reply);
    updateSendButton();
    save();

    if (settings.tts && reply.content) speak(reply.content);
  }
}

async function streamFromAPI(reply, userText) {
  const base = settings.apiUrl.trim().replace(/\/+$/, "");
  const url = /\/chat\/completions$/.test(base) ? base : base + "/chat/completions";

  const history = messages
    .filter(m => m !== reply && !m.pending && m.content)
    .slice(-20)
    .map(m => ({ role: m.role, content: m.content }));

  const payload = {
    model: settings.model || "gpt-4o-mini",
    stream: true,
    messages: [
      ...(settings.systemPrompt ? [{ role: "system", content: settings.systemPrompt }] : []),
      ...history
    ]
  };

  const controller = new AbortController();
  state.controller = controller;

  const res = await fetch(url, {
    method: "POST",
    signal: controller.signal,
    headers: {
      "Content-Type": "application/json",
      ...(settings.apiKey ? { Authorization: "Bearer " + settings.apiKey } : {})
    },
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    const detail = await res.text().catch(() => "");
    throw new Error(`${res.status} ${res.statusText}${detail ? " — " + detail.slice(0, 200) : ""}`);
  }
  if (!res.body) throw new Error("Streaming not supported by this endpoint");

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop() || "";

    for (const raw of lines) {
      const line = raw.trim();
      if (!line.startsWith("data:")) continue;

      const data = line.slice(5).trim();
      if (!data || data === "[DONE]") continue;

      try {
        const json = JSON.parse(data);
        const delta =
          json.choices?.[0]?.delta?.content ??
          json.choices?.[0]?.message?.content ??
          "";
        if (delta) {
          reply.content += delta;
          renderBubble(reply);
          scrollToBottom(false);
        }
      } catch { /* ignore partial frames */ }
    }
  }
}

async function streamFromMock(reply, userText) {
  await sleep(260);
  if (state.stopped) throw new DOMException("Aborted", "AbortError");

  const { text, tools } = mockReply(userText);

  if (tools && tools.length) {
    reply.tools = tools.map(name => ({ name, done: false }));
    renderBubble(reply);
    scrollToBottom(false);
    await sleep(520);
    reply.tools.forEach(t => (t.done = true));
    renderBubble(reply);
    await sleep(180);
  }

  const tokens = text.split(/(\s+)/);
  for (const token of tokens) {
    if (state.stopped) throw new DOMException("Aborted", "AbortError");
    reply.content += token;
    renderBubble(reply);
    scrollToBottom(false);
    await sleep(10 + Math.random() * 22);
  }
}
  /* ---------------- Demo brain ---------------- */
  function mockReply(input) {
    const t = input.toLowerCase();

    if (/\b(hi|hello|hey|yo|good (morning|evening))\b/.test(t)) {
      return {
        text: "Hey! I'm running in **demo mode** right now, so my answers are canned.\n\n" +
              "Try asking me about:\n" +
              "- the weather\n" +
              "- your schedule\n" +
              "- turning on the lights\n" +
              "- setting a reminder\n\n" +
              "To connect a real model, open **Settings** and add an OpenAI-compatible API URL.",
        tools: []
      };
    }

    if (/weather|forecast|temperature|rain/.test(t)) {
      return {
        tools: ["weather.get_current"],
        text: "It's **24 °C** and clear in Nairobi right now, with a light breeze from the east.\n\n" +
              "The rest of the day stays dry — no rain expected before evening."
      };
    }

    if (/schedule|calendar|meeting|agenda|today/.test(t)) {
      return {
        tools: ["calendar.list_events"],
        text: "Here's what's on your calendar today:\n\n" +
              "1. **09:30** — Standup (15 min)\n" +
              "2. **11:00** — Design review with Amina\n" +
              "3. **14:30** — 1:1 with your manager\n\n" +
              "You have a free block between **12:00 and 14:00** if you want to grab lunch."
      };
    }

    if (/light|lamp|smart home|thermostat|turn on|turn off|switch/.test(t)) {
      return {
        tools: ["home.set_device", "home.get_status"],
        text: "Done — the **living room lights** are on at 60% brightness.\n\n" +
              "The thermostat is holding at 22 °C. Want me to dim the lights or start a scene?"
      };
    }

    if (/remind|reminder|todo|task|note/.test(t)) {
      return {
        tools: ["tasks.create"],
        text: "Saved. I'll remind you about that **at 17:00 today**.\n\n" +
              "You can ask me to reschedule it any time — just say *\"move my reminder to 6pm.\"*"
      };
    }

    if (/who are you|what can you do|help|capabilities/.test(t)) {
      return {
        text: "I'm a multi-purpose assistant prototype. The UI you're looking at supports:\n\n" +
              "- **Chat** with streaming responses and markdown\n" +
              "- **Voice input** via the browser's speech recognition\n" +
              "- **Spoken replies** (toggle in Settings)\n" +
              "- **Tool-call chips** so you can see what actions ran\n" +
              "- **Any OpenAI-compatible backend** — FastAPI, Next.js, OpenRouter, Ollama…\n\n" +
              "Right now I'm in demo mode, so the responses above are scripted."
      };
    }

    if (/code|javascript|python|function|snippet/.test(t)) {
      return {
        text: "Here's a small example of a streaming fetch handler:\n\n" +
              "```js\n" +
              "const res = await fetch('/v1/chat/completions', {\n" +
              "  method: 'POST',\n" +
              "  headers: { 'Content-Type': 'application/json' },\n" +
              "  body: JSON.stringify({ model: 'gpt-4o-mini', stream: true, messages })\n" +
              "});\n\n" +
              "const reader = res.body.getReader();\n" +
              "```\n\n" +
              "This page uses exactly that pattern — check the `streamFromAPI` function in the source."
      };
    }

    return {
      text: "I hear you — but I'm in **demo mode**, so I can only answer a handful of scripted topics.\n\n" +
            "**To get real responses:**\n" +
            "1. Open Settings (the gear icon)\n" +
            "2. Paste an OpenAI-compatible base URL, e.g. `http://localhost:8000/v1`\n" +
            "3. Add your API key and model name\n\n" +
            "The page will start streaming from your backend immediately."
    };
  }

  /* ---------------- Text-to-speech ---------------- */
  function speak(markdown) {
    if (!("speechSynthesis" in window)) return;
    const plain = String(markdown)
      .replace(/```[\s\S]*?```/g, " code block ")
      .replace(/`([^`]+)`/g, "$1")
      .replace(/[*_~#>]/g, "")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/\s+/g, " ")
      .trim();

    if (!plain) return;

    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(plain.slice(0, 600));
    utter.rate = 1.02;
    utter.pitch = 1;
    speechSynthesis.speak(utter);
  }

  /* ---------------- Speech recognition ---------------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function setupRecognition() {
    if (!SR) {
      micBtn.disabled = true;
      micBtn.title = "Voice input isn't supported in this browser";
      return;
    }

    const rec = new SR();
    rec.lang = navigator.language || "en-US";
    rec.interimResults = true;
    rec.continuous = false;

    rec.onstart = () => {
      state.listening = true;
      state.voiceBase = inputEl.value;
      micBtn.classList.add("listening");
    };

    rec.onresult = (event) => {
      let interim = "";
      let final = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) final += chunk;
        else interim += chunk;
      }
      const base = state.voiceBase ? state.voiceBase + " " : "";
      inputEl.value = base + (final || interim);
      autosize();
      updateSendButton();

      if (final && settings.autoSend) {
        rec.stop();
        setTimeout(() => send(inputEl.value), 120);
      }
    };

    rec.onerror = (e) => {
      if (e.error !== "aborted" && e.error !== "no-speech") {
        console.warn("Speech recognition error:", e.error);
      }
    };

    rec.onend = () => {
      state.listening = false;
      micBtn.classList.remove("listening");
      autosize();
      updateSendButton();
    };

    state.recognition = rec;
  }

  function toggleMic() {
    if (!state.recognition) return;
    if (state.listening) {
      state.recognition.stop();
    } else {
      try { state.recognition.start(); } catch {}
    }
  }

  /* ---------------- Settings UI ---------------- */
  function openSettings() {
    settingsEl.classList.add("open");
    scrim.classList.add("open");
    settingsEl.setAttribute("aria-hidden", "false");
  }
  function closeSettings() {
    settingsEl.classList.remove("open");
    scrim.classList.remove("open");
    settingsEl.setAttribute("aria-hidden", "true");
  }

  function syncSettingsUI() {
    $("#apiUrl").value = settings.apiUrl;
    $("#apiKey").value = settings.apiKey;
    $("#model").value = settings.model;
    $("#systemPrompt").value = settings.systemPrompt;
    $("#ttsSwitch").classList.toggle("on", settings.tts);
    $("#autoSendSwitch").classList.toggle("on", settings.autoSend);

    const live = !!settings.apiUrl.trim();
    modeBadge.textContent = live ? "Live" : "Demo";
    modeBadge.classList.toggle("live", live);
  }

  function bindSettings() {
    const map = {
      "#apiUrl": "apiUrl",
      "#apiKey": "apiKey",
      "#model": "model",
      "#systemPrompt": "systemPrompt"
    };

    Object.entries(map).forEach(([sel, key]) => {
      $(sel).addEventListener("input", (e) => {
        settings[key] = e.target.value;
        saveSettings();
        syncSettingsUI();
      });
    });

    const bindSwitch = (id, key) => {
      const el = $(id);
      const toggle = () => {
        settings[key] = !settings[key];
        saveSettings();
        syncSettingsUI();
      };
      el.addEventListener("click", toggle);
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    };

    bindSwitch("#ttsSwitch", "tts");
    bindSwitch("#autoSendSwitch", "autoSend");

    $("#settingsBtn").addEventListener("click", openSettings);
    $("#closeSettings").addEventListener("click", closeSettings);
    scrim.addEventListener("click", closeSettings);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeSettings();
    });

    $("#clearBtn").addEventListener("click", () => {
      if (!confirm("Clear the whole conversation?")) return;
      messages = [];
      save();
      renderAll();
      seedWelcome();
      closeSettings();
    });
  }

  /* ---------------- Events ---------------- */
  function bindComposer() {
    inputEl.addEventListener("input", () => {
      autosize();
      updateSendButton();
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        if (!state.streaming) send(inputEl.value);
      }
    });

    sendBtn.addEventListener("click", () => {
      if (state.streaming) {
        state.stopped = true;
        if (state.controller) state.controller.abort();
        if (state.recognition && state.listening) state.recognition.stop();
      } else {
        send(inputEl.value);
      }
    });

    micBtn.addEventListener("click", toggleMic);

    $("#newChatBtn").addEventListener("click", () => {
      if (state.streaming) return;
      messages = [];
      save();
      renderAll();
      seedWelcome();
      inputEl.focus();
    });
  }

  /* ---------------- Boot ---------------- */
  function seedWelcome() {
    if (messages.length) return;
    const greeting =
      "Hi — I'm your assistant.\n\n" +
      "I'm currently running in **demo mode**, so my replies are scripted. " +
      "Click the gear icon to point me at a real OpenAI-compatible backend, " +
      "or just try the mic button and ask me about the weather or your schedule.";
    addMessage("assistant", greeting);
    save();
  }

  function init() {
    syncSettingsUI();
    bindSettings();
    bindComposer();
    setupRecognition();

    renderAll();
    if (!messages.length) seedWelcome();

    autosize();
    updateSendButton();
    inputEl.focus();
  }

  init();
})();
</script>
